<!doctype html><html lang="ru"><head><base href="./public/"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><meta name="theme-color" content="#13251b"><title>TL MooMoo | Survival Arena</title><link rel="stylesheet" href="style.css"></head><body><canvas id="game"></canvas><header id="hud"><div class="logo">TL<span>·</span>MOOMOO <small>ONLINE SURVIVAL</small></div><div id="stats">🌳 0　🪨 0　🍎 0　🪙 0</div><div id="health">HP 100/100 · LEVEL 1</div></header><aside id="leader"><b>🏆 LEADERBOARD</b><div id="ranking"></div></aside><div id="toolbar"><button data-build="wall" title="Стена: 15 дерева">1 · 🧱</button><button data-build="spike" title="Шипы: 20 дерева, 10 камня">2 · 🔺</button><button data-build="mill" title="Мельница: 40 дерева, 20 камня">3 · ⚙</button><button data-build="turret" title="Башня: 60 дерева, 60 камня, 10 золота">4 · 🏹</button><button id="eat" title="Еда: 10 еды">Q · 🍎</button><button id="upgrade" title="Каменный меч: 40 дерева, 30 камня, уровень 3">U · ⚔</button></div><div id="chat"><div id="messages"></div><input id="chatInput" maxlength="100" placeholder="Enter — написать в чат"></div><div id="start"><div class="panel"><div class="mark">TL / SURVIVAL ARENA</div><h1>THE WILD<br><em>IS YOURS.</em></h1><p>Собирай ресурсы. Сражайся. Строй свою империю.</p><input id="nickname" maxlength="18" placeholder="Твой ник" value="Player"><div class="actions"><button id="solo">ОДИНОЧНАЯ ИГРА</button><button id="multi" disabled title="Для мультиплеера нужен Node.js сервер">МУЛЬТИПЛЕЕР · НУЖЕН СЕРВЕР</button></div><div class="hint">WASD — движение · ЛКМ/Space — атака · 1–4 — постройки · Q — еда · U — улучшение · C — клан</div></div></div><div id="toast"></div><div id="touch"><div id="pad">✥</div><button id="attack">⚔</button></div><script src="game.js"></script></body></html>
